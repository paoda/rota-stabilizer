id: moe.paoda.rota-stabilizer
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: rota-stabilizer


finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-videos

modules:
  - name: zig
    buildsystem: simple
    build-commands:
      - install -Dm755 zig /app/bin/zig
      - cp -r lib /app/lib
    sources: 
      - type: archive
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
    
  - name: rota-stabilizer
    buildsystem: simple
    build-options:
      build-args: 
        - --share=network
      env:
        ZIG_GLOBAL_CACHE_DIR: .zig-cache
    build-commands:
      - zig build --verbose -Doptimize=ReleaseSafe -Dcpu=x86_64_v3 install -p /app
      - install -Dm644 moe.paoda.rota-stabilizer.desktop -t /app/share/applications/
    sources:
      - type: dir
        path: .
